# Render Blueprint: deploys the API (with Socket.IO) as a web service.
# Render dashboard -> New -> Blueprint -> pick this repo.
# You will be asked for your Supabase values.
services:
  - type: web
    name: incident-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://incident-tracker-alpha.vercel.app
