name: CI

# One check for every push to main and every pull request:
# backend tests on a real Postgres, then frontend lint and production build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Backend tests
        run: npm test

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend build
        run: npm run build --prefix frontend
